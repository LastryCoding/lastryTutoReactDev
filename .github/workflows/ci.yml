name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and production build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit and component tests
        run: pnpm test

      - name: Validate content structure
        run: pnpm validate:content

      - name: Validate exercise starters and solutions
        run: pnpm validate:exercises

      - name: Build production site
        run: pnpm build

  deploy:
    name: Deploy to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Komodo deployment
        env:
          KOMODO_WEBHOOK_SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
          KOMODO_WEBHOOK_URL: https://komodo.lastry.fr/listener/github/stack/6a9791160ecc397f8d835494/deploy
        run: |
          signature="$(
            openssl dgst -sha256 -hmac "$KOMODO_WEBHOOK_SECRET" "$GITHUB_EVENT_PATH" |
              cut -d ' ' -f 2
          )"

          curl --fail-with-body --retry 3 \
            --header 'Content-Type: application/json' \
            --header 'X-GitHub-Event: push' \
            --header "X-Hub-Signature-256: sha256=$signature" \
            --data-binary "@$GITHUB_EVENT_PATH" \
            "$KOMODO_WEBHOOK_URL"
