services:
  reactquest:
    image: ${REACTQUEST_IMAGE:-reactquest:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - '8080'
    networks:
      caddy:
        aliases:
          - reactquest
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          'http://127.0.0.1:8080/healthz',
        ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

networks:
  caddy:
    external: true
    name: ${CADDY_NETWORK:?Set CADDY_NETWORK to the existing Caddy Docker network}
